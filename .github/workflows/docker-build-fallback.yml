name: Docker Build Fallback (AMD64 Only)

on:
  workflow_dispatch:  # 手动触发
    inputs:
      force_build:
        description: 'Force build even if multi-arch succeeded'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend

jobs:
  # 构建验证作业
  build-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '23.x'
        cache: 'yarn'
        cache-dependency-path: |
          apps/backend/yarn.lock
          apps/frontend/yarn.lock

    - name: Install backend dependencies
      run: |
        cd apps/backend
        yarn install --network-timeout 300000

    - name: Install frontend dependencies
      run: |
        cd apps/frontend
        yarn install --network-timeout 300000

    - name: Fix backend code formatting
      run: |
        cd apps/backend
        yarn lint:fix

    - name: Run backend linting
      run: |
        cd apps/backend
        yarn lint

    - name: Build backend
      run: |
        cd apps/backend
        yarn build

    - name: Build frontend
      run: |
        cd apps/frontend
        yarn build

  # 构建和推送后端镜像 (仅AMD64)
  build-and-push-backend-amd64:
    needs: build-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract backend metadata
      id: backend-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
        tags: |
          type=ref,event=branch,suffix=-amd64
          type=ref,event=pr,suffix=-amd64
          type=semver,pattern={{version}},suffix=-amd64
          type=raw,value=latest-amd64,enable={{is_default_branch}}
          type=sha,prefix={{branch}}-amd64-

    - name: Build and push backend image (AMD64)
      id: backend-build
      uses: docker/build-push-action@v5
      with:
        context: ./apps/backend
        file: ./apps/backend/Dockerfile
        push: true
        tags: ${{ steps.backend-meta.outputs.tags }}
        labels: ${{ steps.backend-meta.outputs.labels }}
        cache-from: type=gha,scope=backend-amd64
        cache-to: type=gha,mode=max,scope=backend-amd64
        platforms: linux/amd64
        provenance: false

  # 构建和推送前端镜像 (仅AMD64)
  build-and-push-frontend-amd64:
    needs: build-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract frontend metadata
      id: frontend-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
        tags: |
          type=ref,event=branch,suffix=-amd64
          type=ref,event=pr,suffix=-amd64
          type=semver,pattern={{version}},suffix=-amd64
          type=raw,value=latest-amd64,enable={{is_default_branch}}
          type=sha,prefix={{branch}}-amd64-

    - name: Build and push frontend image (AMD64)
      id: frontend-build
      uses: docker/build-push-action@v5
      with:
        context: ./apps/frontend
        file: ./apps/frontend/Dockerfile
        push: true
        tags: ${{ steps.frontend-meta.outputs.tags }}
        labels: ${{ steps.frontend-meta.outputs.labels }}
        cache-from: type=gha,scope=frontend-amd64
        cache-to: type=gha,mode=max,scope=frontend-amd64
        platforms: linux/amd64
        provenance: false

  # 部署信息汇总
  deployment-info:
    needs: [build-and-push-backend-amd64, build-and-push-frontend-amd64]
    runs-on: ubuntu-latest
    if: success()

    steps:
    - name: Display deployment information
      run: |
        echo "=== AMD64单平台镜像构建完成 ==="
        echo "后端镜像: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest-amd64"
        echo "前端镜像: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest-amd64"
        echo ""
        echo "=== 部署信息 ==="
        echo "镜像已推送到 GitHub Container Registry"
        echo "这是AMD64单平台构建，适用于x86_64服务器"
        echo ""
        echo "使用以下命令部署到生产环境："
        echo "docker-compose -f deployment/docker-compose.amd64.yml up -d"